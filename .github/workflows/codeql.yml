name: CodeQL

# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom Go queries of the
# organization. This repo keeps no CodeQL config file and sets the triggers
# only (gibson-executor#137).
#
# The scan runs on a push to main, not on merge_group. codeql-action uploads
# the result against github.ref, and GitHub deletes the merge-queue ref before
# the analysis ends (#345). The weekly schedule is the deep scan.
#
# The check name is `CodeQL / CodeQL (go)`. No ruleset requires it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@96b8fa3f95163ce097194672a80f1317830503d4 # v0.17.5
    with:
      languages: '["go"]'
      # The parser tests feed attacker-shaped tool output to each parser, so
      # the scan extracts the test files too (#345). The Go extractor reads
      # this variable from the environment of the build.
      go-build-command: CODEQL_EXTRACTOR_GO_OPTION_EXTRACT_TESTS=true go build ./...
      paths-ignore: |
        **/*.pb.go
        **/testdata/**
