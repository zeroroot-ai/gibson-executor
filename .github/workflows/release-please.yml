name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: gibson-executor

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish version-tagged images + the catalog artifact in the SAME run that
  # cut the release (#118, setec#131 pattern). release-please pushes its tag
  # with the default GITHUB_TOKEN, and GitHub deliberately does not fire
  # `on: push: tags:` workflows from GITHUB_TOKEN pushes (anti-recursion) —
  # so image.yml's and release.yml's tag triggers never saw a release: ghcr
  # only ever carried main/latest/sha-* image tags and the catalog artifact
  # was never published. Chaining via workflow_call avoids the trigger
  # problem without needing a repo PAT (this repo has none).
  release-images:
    name: release-images
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/image.yml
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      version_tag: ${{ needs.release-please.outputs.tag_name }}

  release-catalog:
    name: release-catalog
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      version_tag: ${{ needs.release-please.outputs.tag_name }}
