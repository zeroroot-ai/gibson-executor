# rules.yaml — zeroroot-ai/gibson-executor
#
# Spec: unified-identity-and-authorization Phase J task 10.1.
# Schema: https://github.com/zeroroot-ai/sdk/blob/main/docs/rules-schema.yaml v1.0.0.

version: "1.0.0"

rules:
  - id: tool-runner-auth-001
    description: |
      No legacy auth references. The tool runner holds no credential of
      its own. The gsk_ API keys, BetterAuth, HMAC identity headers and
      TrustLocalhost are all deleted.
    scope:
      - "**/*.go"
      - "**/*.md"
      - "**/*.yaml"
    exempt:
      - "scripts/check-no-legacy-auth.sh"      # the guard itself
      - "**/*_test.go"
      - "docs/auth.md"
      - "docs/forbidden-patterns.md"
      - "docs/rules.yaml"
    pattern:
      kind: forbidden_string
      target: "(gsk_|GSK_API_KEY|HMAC|x-gibson-identity-mac|BetterAuth|better-auth|BETTER_AUTH|TrustLocalhost)"
    severity: error
    message: |
      The legacy stack is gone. A new use of any of these patterns
      reopens the audit findings the spec closed. Read docs/auth.md.
    enforced_by:
      - "script:scripts/check-no-legacy-auth.sh"
      - "ci:tool-runner-make-check"

  - id: tool-runner-auth-002
    description: |
      A declared secret VALUE comes only from the environment, through
      registry.DeclaredSecret and the sdk secretenv.Lookup. The daemon
      sets it at dispatch. A parser must NOT read a credential value
      from the tool input, and must NOT write the value to a log line.
    scope:
      - "**/*.go"
    exempt:
      - "**/*_test.go"
    pattern:
      kind: forbidden_call
      target: "(fmt\\.Print[fl]?n?|log\\.|slog\\.).*GIBSON_SECRET_"
    severity: error
    message: |
      The tool input is stored with the tool call, so it carries only
      the secret name. Log the name, never the value.
    enforced_by:
      - "manual"

  - id: tool-runner-auth-003
    description: |
      The tool runner must NOT import the daemon module
      (github.com/zeroroot-ai/gibson). It depends on the SDK only: the
      generated proto types, extraction and secretenv. An import of the
      daemon would make the cyclic boundary that the polyrepo avoids.
    scope:
      - "**/*.go"
      - "go.mod"
    pattern:
      kind: forbidden_import
      target:
        - "github.com/zeroroot-ai/gibson"
    severity: error
    message: |
      Import what you need from github.com/zeroroot-ai/sdk. If a type
      lives only in the daemon, open a PR moving it into the SDK first.
    enforced_by:
      - "manual"
      - "ci:tool-runner-make-check"

  - id: tool-runner-auth-005
    description: |
      The tool runner has no SPIFFE identity. It runs as a Setec microVM
      guest with no ClusterSPIFFEID, and it dials no daemon RPC. It must
      NOT read SPIFFE_ENDPOINT_SOCKET or call go-spiffe APIs.
    scope:
      - "**/*.go"
    exempt:
      - "**/*_test.go"
    pattern:
      kind: forbidden_import
      target:
        - "github.com/spiffe/go-spiffe/v2/workloadapi"
        - "github.com/spiffe/go-spiffe/v2/svid/jwtsvid"
    severity: error
    message: |
      A runner identity is a new design. Write an ADR in docs/adr/
      before you add one. Read docs/auth.md.
    enforced_by:
      - "manual"

  - id: tool-args-policy-001
    description: |
      Tool argument policy is OPEN by default and denied by capability
      class. A parser's policy.go must not enumerate a tool's flags into
      an allowlist: that work is unbounded, goes stale on every upstream
      release, and fails correct missions with "flag not in tool
      allowlist" when the real cause is that nobody transcribed the flag.
      Declare policy.OpenPolicy with policy.Deny(...) naming only the
      flags that write a caller-named file, read a caller-named file,
      execute scripts, involve a third-party machine, or forge packets /
      alter privilege. See docs/tool-args-policy.md.
    scope:
      - "parsers/**/policy.go"
    exempt:
      - "**/*_test.go"
    pattern:
      kind: forbidden_string
      target: "RegisterArgsPolicy"
    severity: warning
    message: |
      RegisterArgsPolicy registers a per-flag ALLOWLIST. New tools use
      RegisterOpenArgsPolicy with a capability-class deny set instead.
      Read docs/tool-args-policy.md before adding a policy file.
    enforced_by:
      - "review:tool-args-policy"

